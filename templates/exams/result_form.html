{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Add Result{% endblock %}
{% block page_title %}Add Result — {{ exam.name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:600px;">
  <div class="card-body">
    <form method="post">{% csrf_token %}{{ form|crispy }}
      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-primary">Save Result</button>
        <a href="{% url 'exams:detail' exam.pk %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
