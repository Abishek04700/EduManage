{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · EduManage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="d-flex align-items-center gap-2 mb-1">
      <span class="logo-dot" style="background:var(--accent);width:10px;height:10px;border-radius:3px;display:inline-block;"></span>
      <span class="brand-font fw-bold">EduManage</span>
    </div>
    <h4 class="brand-font mt-3 mb-1">Welcome back</h4>
    <p class="text-muted mb-4" style="font-size:.9rem;">Sign in to access your dashboard.</p>

    {% if form.errors %}
      <div class="alert alert-danger py-2" style="font-size:.85rem;">Invalid username or password.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-semibold">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 mt-2">Sign in</button>
    </form>

    <p class="text-muted mt-4 mb-0" style="font-size:.78rem;">
      Demo accounts — admin/admin123 · teacher1/teacher123 · student1/student123
    </p>
  </div>
</div>
</body>
</html>
