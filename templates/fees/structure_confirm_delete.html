{% extends "base.html" %}
{% block title %}Delete Fee Structure{% endblock %}
{% block page_title %}Delete Fee Structure{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
  <div class="card-body">
    <h5>Delete {{ object }}?</h5>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger">Yes, delete</button>
      <a href="{% url 'fees:structure_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
