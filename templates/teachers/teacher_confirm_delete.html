{% extends "base.html" %}
{% block title %}Delete Teacher{% endblock %}
{% block page_title %}Delete Teacher{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
  <div class="card-body">
    <h5>Delete {{ object }}?</h5>
    <p class="text-muted">This will permanently remove the teacher and their account.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, delete</button>
      <a href="{% url 'teachers:list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
