{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Notice Form{% endblock %}
{% block page_title %}{% if notice %}Edit Notice{% else %}Post Notice{% endif %}{% endblock %}
{% block content %}
<div class="card" style="max-width:600px;">
  <div class="card-body">
    <form method="post">{% csrf_token %}{{ form|crispy }}
      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-primary">Publish</button>
        <a href="{% url 'notices:list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
